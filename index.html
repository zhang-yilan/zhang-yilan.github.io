<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yilan Zhang</title>
<style>
  :root { --paper: #f7f6f2; --ink: #24231f; --muted: #77746d; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:"Courier New", "Songti TC", "Songti SC", "STSong", "Noto Serif SC", serif; }
  button { font:inherit; color:inherit; }
  #viewport { position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; }
  #viewport.panning { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; width:1600px; height:1000px; transform-origin:0 0; }
  .item { position:absolute; user-select:none; }
  .item.movable { cursor:move; }
  .picture { width:200px; height:calc(200px * 2 / 3); border:0; padding:0; background:transparent; display:flex; align-items:center; justify-content:center; }
  .picture img { width:100%; height:100%; object-fit:contain; display:block; }
  /* Sharp zoom: give only visible, enlarged photos more rendering pixels.
     Their frame and positions remain exactly 200 x 133.33 (3:2). */
  .picture img.high-res-render {
    position:absolute; left:0; top:0;
    width:calc(100% * var(--photo-detail, 1));
    height:calc(100% * var(--photo-detail, 1));
    transform:scale(calc(1 / var(--photo-detail, 1)));
    transform-origin:top left;
  }
  .picture, .picture img, .picture .placeholder { cursor:grab; }
  .item img, .item a { -webkit-user-drag:none; user-drag:none; }
  .item.dragging, .item.dragging * { cursor:grabbing !important; }
  .picture .placeholder { font-size:10px; color:var(--muted); }
  .picture:hover { outline:none; }
  .word { white-space:pre-wrap; line-height:1.45; font-size:14px; max-width:260px; }
  .word.heading { font-size:18px; }
  /* Name and Notes tags: always remain on one horizontal line. */
  .item[data-type="name"], .item[data-type="me"], .item[data-type="notes"] { white-space:nowrap; width:max-content; max-width:none; }
  .item[data-type="name"] a, .item[data-type="me"] a { white-space:nowrap; }
  .word.heading a { color:inherit; text-decoration:none; -webkit-user-drag:none; user-select:none; cursor:pointer; }
  .word.heading a:hover { text-decoration:underline; text-underline-offset:4px; }
  .word.subheading { font-size:24px; }
  .instruction { font-size:16px; cursor:pointer; }
  .item.instruction { cursor:pointer; }
  .instruction:hover { text-decoration:underline; text-underline-offset:4px; }
  #controls { position:fixed; inset:0; z-index:10; pointer-events:none; }
  #controls button { position:absolute; right:3px; transform:translateY(-50%); writing-mode:vertical-rl; text-orientation:mixed; background:transparent; border:0; padding:5px 0; cursor:pointer; font-size:14px; font-family:inherit; pointer-events:auto; }
  #reset-view { top:calc(33.333% + 12px); }
  #save-layout { top:calc(66.667% + 12px); }
  #controls button:hover { text-decoration:underline; text-underline-offset:4px; }
  .gallery-button { background:transparent; border:0; padding:6px 9px; cursor:pointer; }
  .gallery-button:hover { text-decoration:none; }
  #search { position:fixed; bottom:13px; left:17px; z-index:10; display:flex; align-items:center; gap:8px; font-size:18px; }
  #search label { cursor:text; }
  #search input { width:150px; border:0; outline:0; background:transparent; border-radius:0; padding:2px 0 1px; font:inherit; color:inherit; appearance:none; }
  #search input::-webkit-search-cancel-button { display:none; }
  #search-status { display:none; }

  /* INLINE GALLERY — EDIT HERE: controls live in the Works canvas, not a popup. */
  .picture { position:relative; overflow:visible; }
  /* Keep the magnified caption in front of neighboring pictures. */
  .item.inline-gallery-active { z-index:5; }
  .inline-gallery-controls { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 220ms ease; }
  .inline-gallery-controls.visible { opacity:1; }
  .inline-gallery-controls button { position:absolute; top:50%; transform:translateY(-50%); border:0; background:var(--paper); padding:5px 7px; font:inherit; font-size:17px; cursor:pointer; pointer-events:auto; }
  .inline-gallery-controls .inline-prev { left:calc(-1 * var(--inline-arrow-gap, 38px)); transform:translate(-100%, -50%) scale(var(--inline-ui-inverse, 1)); transform-origin:right center; }
  .inline-gallery-controls .inline-next { right:calc(-1 * var(--inline-arrow-gap, 38px)); transform:translate(100%, -50%) scale(var(--inline-ui-inverse, 1)); transform-origin:left center; }
  .inline-gallery-caption { position:absolute; top:calc(100% + var(--inline-caption-gap, 12px)); left:50%; transform:translateX(-50%) scale(var(--inline-ui-inverse, 1)); transform-origin:center top; width:calc(100% / var(--inline-ui-inverse, 1)); max-width:none; text-align:center; white-space:pre-wrap; font-size:12px; line-height:18px; pointer-events:none; }

  /* On phones, keep gallery arrows together below the caption. */
  @media (max-width:600px) {
    .inline-gallery-controls .inline-prev,
    .inline-gallery-controls .inline-next {
      top:calc(100% + var(--inline-caption-gap, 0px) + var(--inline-caption-height, 0px) + var(--inline-mobile-arrow-gap, 0px));
      padding:8px 13px;
      font-size:20px;
    }
    .inline-gallery-controls .inline-prev {
      left:50%; right:auto;
      transform:translate(-100%, 0) scale(var(--inline-ui-inverse, 1));
      transform-origin:right top;
    }
    .inline-gallery-controls .inline-next {
      left:50%; right:auto;
      transform:translate(0, 0) scale(var(--inline-ui-inverse, 1));
      transform-origin:left top;
    }
  }
  .picture .inline-gallery-video { display:none; width:100%; height:100%; object-fit:contain; }

  /* Video controls remain a fixed on-screen size when the Works canvas zooms. */
  .picture .video-shell { position:absolute; inset:0; display:none; }
  .picture .video-shell .inline-gallery-video { display:block; width:100%; height:100%; }
  /* Keep mobile video playback inline and retain the custom player UI. */
  .picture .video-shell .inline-gallery-video::-webkit-media-controls { display:none !important; }
  .picture .video-shell .inline-gallery-video::-webkit-media-controls-enclosure { display:none !important; }
  .video-bar {
    position:absolute; bottom:0; left:0;
    width:calc(100% / var(--inline-ui-inverse, 1));
    display:flex; align-items:center; gap:9px;
    padding:12px 12px 7px;
    color:#000; background:transparent;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
    font:12px/1 'Courier New',monospace;
    transform:scale(var(--inline-ui-inverse, 1));
    transform-origin:left bottom;
  }
  .video-shell:hover .video-bar, .video-shell:focus-within .video-bar, .video-shell.show-controls .video-bar { opacity:1; pointer-events:auto; }
  .video-bar button { border:0; background:none; color:inherit; padding:2px; font:inherit; font-size:16px; cursor:pointer; line-height:1; flex:none; }
  .video-bar input[type=range] { appearance:none; -webkit-appearance:none; min-width:0; height:16px; margin:0; background:transparent; cursor:pointer; }
  .video-bar input[type=range]::-webkit-slider-runnable-track { height:2px; border-radius:2px; background:#000; }
  .video-bar input[type=range]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:7px; height:7px; border-radius:50%; background:#000; margin-top:-2.5px; border:0; }
  .video-bar input[type=range]::-moz-range-track { height:2px; border-radius:2px; background:#000; }
  .video-bar input[type=range]::-moz-range-thumb { width:7px; height:7px; border:0; border-radius:50%; background:#000; }
  .video-bar .video-play svg { display:block; width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:butt; }
  .video-bar .video-mute svg { display:block; width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .video-bar .video-mute.is-muted .sound-waves { display:none; }
  .video-bar .video-mute.is-muted svg { opacity:.65; }
  .video-bar .video-seek { flex:1; }
  .video-bar .video-volume { width:45px !important; flex:none; }
  @media (hover:none) {
    .video-bar { padding:12px 9px 7px; opacity:1; pointer-events:auto; }
    .video-bar button { padding:5px; }
    .picture .video-shell .inline-gallery-video { -webkit-playsinline: true; }
  }
  #gallery { display:none; position:fixed; inset:0; z-index:20; background:var(--paper); }
  #gallery.open { display:block; overflow:hidden; touch-action:none; }
  /* EDIT — Entire gallery zooms and pans as one canvas. */
  #gallery-stage { position:absolute; inset:0; display:flex; flex-direction:column; transform-origin:0 0; will-change:transform; touch-action:none; }
  #gallery-stage.panning { cursor:grabbing; }
  #gallery-top { padding:18px 22px; display:flex; align-items:center; justify-content:space-between; font-size:13px; }
  #close { border:0; background:none; cursor:pointer; font-size:22px; padding:0 5px; }
  #gallery-main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:18px; padding:0 18px; }
  #gallery-image-wrap { height:100%; max-height:calc(100vh - 135px); flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
  #gallery-image, #gallery-video { max-width:100%; max-height:100%; object-fit:contain; }
  #gallery-video { display:none; width:100%; }
  /* GALLERY ZOOM — editable: image can grow beyond the gallery frame. */
  #gallery-image-wrap { overflow:hidden; touch-action:none; cursor:grab; }
  #gallery-image-wrap.zoom-dragging { cursor:grabbing; }
  #gallery-image { transform-origin:center center; will-change:transform; user-select:none; -webkit-user-drag:none; }

  #gallery-caption { height:104px; flex:0 0 104px; overflow-y:auto; padding:12px 22px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:12px; line-height:18px; white-space:pre-wrap; }
  #notes-name, #notes-switch { position:absolute; z-index:4; white-space:pre-wrap; cursor:pointer; user-select:none; -webkit-user-drag:none; touch-action:none; }
  #notes-name { font-size:18px; line-height:1.45; color:var(--ink); text-decoration:none; }
  #notes-name:hover { text-decoration:underline; text-underline-offset:4px; }
  #notes-switch { font-size:16px; line-height:normal; padding:0; margin:0; float:none; border:0; background:transparent; font-family:inherit; color:inherit; text-align:left; }
  #notes-switch:hover { text-decoration:underline; text-underline-offset:4px; }
  #me-navigation { position:absolute; top:0; left:0; display:flex; gap:28px; padding:0; z-index:3; white-space:nowrap; }
  #me-navigation button { float:none; border:0; background:transparent; padding:0; font:inherit; font-size:16px; cursor:pointer; }
  #me-navigation button:hover { text-decoration:underline; text-underline-offset:4px; }
  #notes-viewport { position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none; }
  #notes-viewport.panning { cursor:grabbing; }
  #notes-world { position:absolute; top:0; left:0; width:1600px; height:1000px; transform-origin:0 0; }
  .note-link { position:absolute; transform:translateX(-50%); text-align:center; font-size:16px; line-height:1.45; white-space:nowrap; cursor:grab; user-select:none; }
  .note-link a:link { color:#24231f; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  .note-link a:visited { color:#2259b5; text-decoration:underline; }
  .note-link a:hover { text-decoration:underline; }
  .note-link a { -webkit-user-drag:none; user-select:none; }
  body.notes-active #controls, body.notes-active #search { z-index:18; }
  #notes-panel, .info-panel { display:none; position:fixed; z-index:15; inset:0; overflow:auto; background:var(--paper); padding:28px; }
  #notes-panel.open, .info-panel.open { display:block; }
  #notes-panel button:not(#notes-switch), .close-info { float:right; border:0; background:none; cursor:pointer; font-size:22px; }
  #notes-content, .info-content { max-width:680px; margin:25vh auto; font-size:16px; line-height:1.5; white-space:pre-wrap; }

/* ==================== EDIT 2 — PHONE NAVIGATION =========================
   NO PHONE CODE NEEDS TO BE PASTED HERE.

   The Layout Editor also generates const MOBILE_POSITIONS = { ... }.
   Ignore that second block for this version of the website:
   desktop and phone intentionally use the SAME picture coordinates.
   The exported phone coordinates you supplied are identical to desktop.

   The function originalWorkPosition() below already handles phones:
   pictures use the x/y values from EDIT 1, while the name and Notes
   tags are repositioned to fit the phone screen. phoneOpeningPan()
   controls the initial phone view. Leave these functions unchanged.

   If you later arrange DIFFERENT phone picture positions in the editor,
   this website will need a code change to use MOBILE_POSITIONS.
======================================================================== */
const isMobile = () => window.matchMedia("(max-width:600px)").matches;
const mobileWidth = () => Math.max(280, Math.min(window.innerWidth, 600));
// Phone opens on the first picture, at the left edge and below the header.
// The picture arrangement itself is never changed.
function phoneOpeningPan() {
  const first = ELEMENTS.find(item => item.type === "image");
  if (!first) return {x:0,y:0};
  return {x:-first.x, y:Math.round(window.innerHeight * 0.37 - first.y)};
}
function originalWorkPosition(item) {
  // EDIT 1 controls all composition coordinates, including the name and Notes tags.
  // Desktop and phone share these coordinates.
  return {x:item.x,y:item.y};
}
const world = document.querySelector("#world");
const viewport = document.querySelector("#viewport");
const gallery = document.querySelector("#gallery");
const galleryImage = document.querySelector("#gallery-image");
const galleryCaption = document.querySelector("#gallery-caption");
const galleryVideo = document.querySelector("#gallery-video");
let scale = 1, panX = isMobile()?phoneOpeningPan().x:-20, panY = isMobile()?phoneOpeningPan().y:-5;
let drag = null, moved = false, activeIndex = 0;
let activeGallery = [];
/* GALLERY ZOOM SETTINGS (EDIT HERE)
   Enter gallery when a centered work fills this fraction of the available screen.
   The image can keep growing after the gallery opens. */
const GALLERY_TRIGGER_FRACTION = 0.86; // EDIT: 0.86 means 86% of available image area
const GALLERY_EXIT_FRACTION = 0.90;
let galleryZoom = 1, galleryOffsetX = 0, galleryOffsetY = 0;
let galleryWorkId = null;
const galleryStage = document.querySelector("#gallery-stage");
const galleryWrap = document.querySelector("#gallery-image-wrap");
function updateGalleryZoom() {
  // Zoom the entire gallery composition, including arrows, caption and close button.
  galleryStage.style.transform = `translate(${galleryOffsetX}px, ${galleryOffsetY}px) scale(${galleryZoom})`;
}
function resetGalleryZoom() {
  galleryZoom = 1; galleryOffsetX = 0; galleryOffsetY = 0;
  updateGalleryZoom();
}
function zoomGalleryAt(next, clientX, clientY) {
  if (next < 1) { closeGallery(); return; }
  next = boundedZoom(next);
  galleryOffsetX = clientX - (clientX - galleryOffsetX) * next / galleryZoom;
  galleryOffsetY = clientY - (clientY - galleryOffsetY) * next / galleryZoom;
  galleryZoom = next;
  updateGalleryZoom();
}
function galleryThreshold() {
  return Math.min(window.innerWidth * .78, window.innerHeight * .73) * GALLERY_TRIGGER_FRACTION;
}
// Cache image elements rather than querying the DOM during every zoom step.
let galleryTriggerPictures=[];
let galleryTriggerFrame=0;
function scheduleGalleryZoomTrigger() {
  if (galleryTriggerFrame) return;
  galleryTriggerFrame=requestAnimationFrame(() => {galleryTriggerFrame=0;checkGalleryZoomTrigger();});
}
// INLINE GALLERY — trigger is based on the picture's actual screen size.
// The image remains in the Works canvas; only arrows and captions appear.
function checkGalleryZoomTrigger() {
  if (isNotesActive()) return;
  const centerX=innerWidth/2, centerY=innerHeight/2;
  const threshold=galleryThreshold();
  let best=null, bestDistance=Infinity;
  for (const el of galleryTriggerPictures) {
    const picture=el.querySelector('.picture');
    if (!picture) continue;
    const r=picture.getBoundingClientRect();
    // Keep the original photo crisp at fractional zoom levels without
    // allocating large image layers for every off-screen work.
    const visible=r.right>0 && r.bottom>0 && r.left<innerWidth && r.top<innerHeight;
    const img=picture.querySelector('img');
    if (img) {
      const detail=visible && scale>1.25 ? (scale>3 ? 4 : 2) : 1;
      if (Number(img.dataset.detail || 1)!==detail) {
        img.dataset.detail=detail;
        img.style.setProperty('--photo-detail',detail);
        img.classList.toggle('high-res-render',detail>1);
      }
    }
    const size=Math.min(r.width,r.height);
    if (size < threshold * (galleryWorkId ? GALLERY_EXIT_FRACTION : 1)) continue;
    // Select the eligible image nearest the viewport center, even while panning.
    const dx=(r.left+r.right)/2-centerX;
    const dy=(r.top+r.bottom)/2-centerY;
    const distance=Math.hypot(dx,dy);
    // Avoid activating a distant image just because it is large.
    if (Math.abs(dx)>Math.max(r.width*.55,innerWidth*.18) ||
        Math.abs(dy)>Math.max(r.height*.55,innerHeight*.18)) continue;
    if (distance<bestDistance) { best=el; bestDistance=distance; }
  }
  const nextId=best?.dataset.id || null;
  if (nextId===galleryWorkId) return;
  if (nextId) openGallery(nextId,true);
  else if (galleryWorkId) closeGallery();
}

const NOTES = [
  "2026.2.24", "2026.3.12", "2026.3.20", "2026.4.22",
  "2026.5.2", "2026.5.4", "2026.5.6", "2026.5.7",
  "2026.5.8", "2026.5.9", "2026.5.12", "2026.5.13",
  "2026.5.16", "2026.5.16_1", "2026.5.16_2", "2026.6.3",
  "2026.6.8", "2026.6.13"
].map((label, i) => ({ id:"note-"+i, label, href:"pdfs/"+label+".pdf", x:800, y:125+i*38 }));
function originalNotePosition(note, i) {
  return isMobile() ? {x:mobileWidth()/2, y:105+i*29} : {x:note.x,y:note.y};
}
const notesViewport = document.querySelector("#notes-viewport");
const notesWorld = document.querySelector("#notes-world");
let notesScale=1, notesPanX=0, notesPanY=0, notesDrag=null, notesMoved=false;
let notesViewInitialized=false;
let notesNavInitialized=false;
const notesNavOriginal = {};
function applyNotesView() { notesWorld.style.transform=`translate(${notesPanX}px, ${notesPanY}px) scale(${notesScale})`; }
function createNote(note) {
  const el=document.createElement("div"); el.className="note-link"; el.dataset.id=note.id;
  const a=document.createElement("a"); a.href=note.href; a.target="_blank"; a.rel="noopener"; a.textContent=note.label;
  // Prevent the browser from dragging a PDF URL as a ghost/grey link box.
  a.draggable = false;
  a.addEventListener("dragstart", e => e.preventDefault());
  a.addEventListener("click", e => { if(notesMoved) { e.preventDefault(); e.stopPropagation(); } });
  el.appendChild(a); notesWorld.appendChild(el); setPosition(el,...Object.values(originalNotePosition(note, NOTES.indexOf(note))));
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0 || pinch || touchPoints.size>1)return;
    notesDrag={kind:"item",el,startX:e.clientX,startY:e.clientY,x:Number(el.dataset.x),y:Number(el.dataset.y)};
    notesMoved=false;
    // Do not capture the pointer: doing so redirects the click away from the PDF link.
    // The window pointermove listener already handles dragging outside the link.
    e.stopPropagation();
  });
}
NOTES.forEach(createNote); applyNotesView();
// Navigation on Notes is draggable, but a simple click still follows its action.
// Disabling native link dragging avoids the grey URL preview.
for (const id of ["notes-name", "notes-switch"]) {
  const el = document.getElementById(id);
  el.addEventListener("dragstart", e => e.preventDefault());
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0 || pinch || touchPoints.size > 1) return;
    notesDrag = {kind:"item", el, startX:e.clientX, startY:e.clientY,
      x:Number(el.dataset.x), y:Number(el.dataset.y)};
    notesMoved = false;
    e.stopPropagation();
  });
  // Suppress click after moving, but never interfere with an ordinary click.
  el.addEventListener("click", e => {
    if (notesMoved) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
}

notesViewport.addEventListener("pointerdown",e=>{
  if(e.button!==0 || pinch || touchPoints.size>1 || e.target.closest(".note-link") || e.target.closest("#notes-name, #notes-switch"))return;
  notesDrag={kind:"pan",startX:e.clientX,startY:e.clientY,x:notesPanX,y:notesPanY};
  notesMoved=false; notesViewport.classList.add("panning"); notesViewport.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove",e=>{
  if(!notesDrag || pinch)return;
  const dx=e.clientX-notesDrag.startX,dy=e.clientY-notesDrag.startY;
  if(Math.abs(dx)+Math.abs(dy)>3) notesMoved=true;
  if(notesDrag.kind==="pan") {notesPanX=notesDrag.x+dx;notesPanY=notesDrag.y+dy;applyNotesView();}
  else setPosition(notesDrag.el,notesDrag.x+dx/notesScale,notesDrag.y+dy/notesScale);
});
window.addEventListener("pointerup",()=>{
  if(!notesDrag)return;
  const wasMoved=notesMoved;
  notesDrag=null;notesViewport.classList.remove("panning");
  if(wasMoved)setTimeout(()=>notesMoved=false,100);else notesMoved=false;
});
notesViewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const old=notesScale, next=boundedZoom(old*(e.deltaY<0?1.08:.92));
  const r=notesViewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  notesPanX=x-(x-notesPanX)*next/old;notesPanY=y-(y-notesPanY)*next/old;
  notesScale=next;applyNotesView();
},{passive:false});
/* EDIT — NOTES PAGE: responsive fit of all PDF titles */
function fitNotesPage() {
  const vw=notesViewport.clientWidth, vh=notesViewport.clientHeight;
  if (!vw || !vh) return;
  // Place PDF links in one column, with fixed spacing in world coordinates.
  const step=42, x=800, top=70;
  NOTES.forEach((note,i)=>{
    const el=notesWorld.querySelector(`[data-id="${note.id}"]`);
    if(el) setPosition(el,x,top+i*step);
  });
  // Navigation positions in the same coordinate system, independent of Works.
  const name=document.getElementById("notes-name");
  const works=document.getElementById("notes-switch");
  setPosition(name,100,top);
  setPosition(works,1210,top+Math.max(0,NOTES.length-1)*step*.28);
  // Fit the full vertical PDF list and the horizontal composition to viewport.
  const bottom=top+Math.max(0,NOTES.length-1)*step+35;
  const minX=100,maxX=1350,minY=top,maxY=bottom;
  const marginX= Math.min(42,vw*.04), marginY=Math.min(32,vh*.04);
  // Center the PDF column itself, rather than the bounding box of all tags.
  // Leave sufficient room on either side for the name and Works navigation.
  const pdfCenterX=x+50;
  notesScale=Math.min(
    (vw/2-marginX)/(pdfCenterX-minX),
    (vw/2-marginX)/(maxX-pdfCenterX),
    (vh-2*marginY)/(maxY===minX?1:bottom-minY),
    1.35
  );
  // NOTES PAGE — HORIZONTAL POSITION (EDIT HERE)
  // Positive value shifts the PDF column and Works tag right together.
  // Keep this proportional to viewport width for different screen sizes.
  const NOTES_RIGHT_SHIFT = Math.min(70, vw * 0.04);
  notesPanX=vw/2-pdfCenterX*notesScale+NOTES_RIGHT_SHIFT;
  notesPanY=vh/2-((minY+maxY)/2)*notesScale;
  applyNotesView();
}
function resetNotes() { fitNotesPage(); }
function isNotesActive(){return document.querySelector("#notes-panel").classList.contains("open") && !document.querySelector("#me-panel").classList.contains("open");}
function syncPageControls(){document.body.classList.toggle("notes-active",isNotesActive());document.querySelector("#search-input").value="";filterCurrentPage("");}
function filterCurrentPage(query){
  const terms=query.trim().toLocaleLowerCase().split(/\s+/u).filter(Boolean);
  const matches=text=>terms.every(term=>String(text||"").toLocaleLowerCase().includes(term));
  if(isNotesActive()) {
    notesWorld.querySelectorAll(".note-link").forEach(el=>{
      const note=NOTES.find(n=>n.id===el.dataset.id);
      el.style.opacity=!terms.length||matches(note?.label)?"1":"0.18";
    });
  } else {
    world.querySelectorAll(".item").forEach(el=>{
      const item=ELEMENTS.find(n=>n.id===el.dataset.id);
      // Include the primary caption and all captions in this work's gallery.
      const captions=[item?.caption,...(WORK_GALLERIES[item?.id]||[]).map(media=>media.caption)].filter(Boolean).join(" ");
      const hit=item?.type==="image" && matches(captions);
      el.style.opacity=!terms.length||hit?"1":"0.18";
    });
  }
}

function showMe() {
  const panel=document.querySelector("#me-panel");
  panel.classList.add("open");
  panel.scrollTop=0;
  syncPageControls();
}
function showNotes() {
  const panel=document.querySelector("#notes-panel");
  panel.classList.add("open");
  panel.scrollTop=0;
  syncPageControls();
  fitNotesPage();
}
document.querySelector("#notes-switch").addEventListener("click", () => { if (notesMoved) return; document.querySelector("#notes-panel").classList.remove("open");syncPageControls(); });
document.querySelector("#notes-name").addEventListener("click", e => { e.preventDefault(); if (!notesMoved) showMe(); });
document.querySelector("#me-to-works").addEventListener("click", () => {
  document.querySelector("#me-panel").classList.remove("open");
  document.querySelector("#notes-panel").classList.remove("open");
  syncPageControls();
});
document.querySelector("#me-to-notes").addEventListener("click", () => {
  document.querySelector("#me-panel").classList.remove("open");
  if (!document.querySelector("#notes-panel").classList.contains("open")) showNotes();
  syncPageControls();
});
document.querySelector("#reset-view").addEventListener("click", () => {
  if(isNotesActive()){resetNotes();return;}
  // Restore the original coordinates from ELEMENTS for every canvas item.
  ELEMENTS.forEach(item => {
    const el = [...world.querySelectorAll(".item")].find(node => node.dataset.id === item.id);
    if (el) { const pos=originalWorkPosition(item); setPosition(el,pos.x,pos.y); }
  });
  // Frame the complete original composition automatically.
  fitWorksComposition();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeGallery(); document.querySelector("#notes-panel").classList.remove("open"); document.querySelector("#me-panel").classList.remove("open");syncPageControls(); }
  if (galleryWorkId && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) stepGallery(e.key === "ArrowRight" ? 1 : -1);
});
// SAVE BUTTON — export the complete layout, independent of the current zoom.
document.querySelector("#save-layout").addEventListener("click", async () => {
  // Local file:// pages give images opaque origins in Chromium/Edge.
  // No canvas export code can bypass this browser security restriction.
  if (location.protocol === "file:") {
    alert("To save the complete layout, open this website through http://localhost or your published GitHub Pages URL, not by double-clicking the HTML file.\n\nOn Mac: open Terminal in your website folder, run: python3 -m http.server 8000\nThen visit: http://localhost:8000/ in Edge.");
    return;
  }
  if (typeof html2canvas !== "function") {
    alert("The screenshot library could not load. Please check your internet connection.");
    return;
  }
  const notes = isNotesActive();
  const source = notes ? notesWorld : world;
  // Measure actual movable objects, not the visible browser window or the
  // nominal 1600 x 1000 world (artwork may extend beyond either).
  const objects = [...source.children].filter(el =>
    el.matches('.item, .note-link, #notes-name, #notes-switch'));
  if (!objects.length) return;
  const margin = 45;
  const bounds = objects.reduce((b, el) => {
    const x = parseFloat(el.style.left) || 0;
    const y = parseFloat(el.style.top) || 0;
    // Note links are centered on their x coordinate via translateX(-50%).
    const left = x - (el.classList.contains('note-link') ? el.offsetWidth / 2 : 0);
    b.minX = Math.min(b.minX, left);
    b.minY = Math.min(b.minY, y);
    b.maxX = Math.max(b.maxX, left + el.offsetWidth);
    b.maxY = Math.max(b.maxY, y + el.offsetHeight);
    return b;
  }, {minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity});
  const width = Math.ceil(bounds.maxX - bounds.minX + margin * 2);
  const height = Math.ceil(bounds.maxY - bounds.minY + margin * 2);
  const background = getComputedStyle(document.body).backgroundColor;
  const exportWorld = source.cloneNode(true);
  // Keep the capture in normal document coordinates: a fixed-position holder
  // is clipped to the viewport by html2canvas on some browsers.
  const holder = document.createElement('div');
  holder.style.cssText = `position:absolute;left:0;top:0;width:${width}px;height:${height}px;pointer-events:none;z-index:-1;overflow:hidden;background:${background};`;
  exportWorld.style.cssText = `position:relative;left:${margin-bounds.minX}px;top:${margin-bounds.minY}px;width:${source.offsetWidth}px;height:${source.offsetHeight}px;transform:none;transform-origin:0 0;overflow:visible;background:transparent;`;
  holder.appendChild(exportWorld);
  document.body.appendChild(holder);
  const button = document.querySelector("#save-layout");
  button.style.pointerEvents = "none";
  try {
    await Promise.all([...exportWorld.querySelectorAll("img")].map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener("load", resolve, {once:true});
        img.addEventListener("error", resolve, {once:true});
      });
    }));
    const canvas = await html2canvas(holder, {
      backgroundColor: background,
      scale: 1.5,
      width, height,
      windowWidth: Math.max(innerWidth, width),
      windowHeight: Math.max(innerHeight, height),
      scrollX: 0, scrollY: 0,
      useCORS: true,
      logging: false
    });
    if (!canvas.width || !canvas.height) throw new Error("Empty screenshot canvas");
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    if (!blob) throw new Error("Unable to encode PNG (possibly cross-origin images)");
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = notes ? "notes-canvas-layout.png" : "entire-canvas-layout.png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (error) {
    console.error("Full-layout screenshot failed:", error);
    alert(error && error.name === "SecurityError" ? "An image is blocked from screenshot export by browser cross-origin security. Check that the site and artwork files are loaded from the same http://localhost or HTTPS origin, then retry." : "Unable to save the full layout. Open the browser console for details.");
  } finally {
    holder.remove();
    button.style.pointerEvents = "";
  }
});

// Search artwork captions (including gallery media), without changing positions.
document.querySelector("#search-input").addEventListener("input", event => filterCurrentPage(event.target.value));

</script>
