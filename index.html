<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yilan Zhang</title>
<style>
  :root { --paper: #f7f6f2; --ink: #24231f; --muted: #77746d; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:"Courier New", "Portfolio Songti", "Embedded Mobile Songti", "Songti TC", "Songti SC", "STSong", "Noto Serif SC", serif; }
  button { font:inherit; color:inherit; }
  #viewport { position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; }
  #viewport.panning { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; width:1600px; height:1000px; transform-origin:0 0; }
  .item { position:absolute; user-select:none; }
  .item.movable { cursor:move; }
  .picture { width:200px; height:calc(200px * 2 / 3); border:0; padding:0; background:transparent; display:flex; align-items:center; justify-content:center; }
  .picture img { width:100%; height:100%; object-fit:contain; display:block; }
  .picture, .picture img, .picture .placeholder { cursor:grab; }
  .item[data-type="me"] .picture, .item[data-type="me"] img, .item[data-type="me"] .quiet-link,
  .item[data-type="notes"] .picture, .item[data-type="notes"] img, .item[data-type="notes"] .quiet-link { cursor:pointer; }
  .item img, .item a { -webkit-user-drag:none; user-drag:none; }
  .item.dragging, .item.dragging * { cursor:grabbing !important; }
  .picture .placeholder { font-size:10px; color:var(--muted); }
  .picture:hover { outline:none; }
  .word { white-space:pre-wrap; line-height:1.45; font-size:14px; max-width:260px; }
  .word.heading { font-size:18px; }
  /* Name and Notes tags: always remain on one horizontal line. */
  .item[data-type="name"], .item[data-type="me"], .item[data-type="notes"] { white-space:nowrap; width:max-content; max-width:none; }
  .item[data-type="name"] a, .item[data-type="me"] a { white-space:nowrap; }
  .word.heading .quiet-link { color:inherit; text-decoration:none; -webkit-user-drag:none; user-select:none; cursor:pointer; }
  .word.heading .quiet-link:hover { text-decoration:underline; text-underline-offset:4px; }
  .word.subheading { font-size:24px; }
  .instruction { font-size:16px; cursor:pointer; }
  .item.instruction { cursor:pointer; }
  .instruction:hover { text-decoration:underline; text-underline-offset:4px; }
  #controls { position:fixed; inset:0; z-index:10; pointer-events:none; }
  #controls button { position:absolute; right:3px; transform:translateY(-50%); writing-mode:vertical-rl; text-orientation:mixed; background:transparent; border:0; padding:5px 0; cursor:pointer; font-size:14px; font-family:inherit; pointer-events:auto; }
  #reset-view { top:calc(33.333% + 12px); }
  #save-layout { top:calc(66.667% + 12px); }
  #controls button:hover { text-decoration:underline; text-underline-offset:4px; }
  .gallery-button { background:transparent; border:0; padding:6px 9px; cursor:pointer; }
  .gallery-button:hover { text-decoration:none; }
  #search { position:fixed; bottom:13px; left:17px; z-index:10; display:flex; align-items:center; gap:8px; font-size:18px; }
  #search label { cursor:text; }
  #search input { width:150px; border:0; outline:0; background:transparent; border-radius:0; padding:2px 0 1px; font:inherit; color:inherit; appearance:none; }
  #search input::-webkit-search-cancel-button { display:none; }
  #search-status { display:none; }
  /* Clickable punctuation inherits the exact surrounding font and layout. */
  .comma-link, .comma-link:visited, .comma-link:hover {
    color:inherit; font:inherit; letter-spacing:inherit; text-decoration:none !important;
    cursor:pointer; -webkit-text-decoration:none; pointer-events:auto;
  }
  .inline-gallery-caption .comma-link { pointer-events:auto; }


  /* INLINE GALLERY — EDIT HERE: controls live in the Works canvas, not a popup. */
  .picture { position:relative; overflow:visible; }
  /* Keep the magnified caption in front of neighboring pictures. */
  .item.inline-gallery-active { z-index:5; }
  .inline-gallery-controls { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 220ms ease; }
  .inline-gallery-controls.visible { opacity:1; }
  .inline-gallery-controls button { position:absolute; top:50%; transform:translateY(-50%); border:0; background:transparent; padding:5px 7px; font:inherit; font-size:17px; cursor:pointer; pointer-events:auto; }
  .inline-gallery-controls .inline-prev { left:calc(-1 * var(--inline-arrow-gap, 38px)); transform:translate(-100%, -50%) scale(var(--inline-caption-inverse, var(--inline-ui-inverse, 1))); transform-origin:right center; }
  .inline-gallery-controls .inline-next { right:calc(-1 * var(--inline-arrow-gap, 38px)); transform:translate(100%, -50%) scale(var(--inline-caption-inverse, var(--inline-ui-inverse, 1))); transform-origin:left center; }
  .inline-gallery-caption { position:absolute; top:calc(100% + var(--inline-caption-gap, 12px)); left:50%; transform:translateX(-50%) scale(var(--inline-caption-inverse, var(--inline-ui-inverse, 1))); transform-origin:center top; width:calc(100% / var(--inline-caption-inverse, var(--inline-ui-inverse, 1))); max-width:none; text-align:center; white-space:pre-wrap; font-size:12px; line-height:18px; pointer-events:none; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; }

  /* Only the rendered caption characters can be selected; never its empty layout box. */
  .inline-gallery-caption .caption-text { pointer-events:none; cursor:text; user-select:text; -webkit-user-select:text; touch-action:auto; }
  .inline-gallery-controls.visible .caption-text { pointer-events:auto; }

  /* iPad only: use the same embedded Chinese Songti glyphs as phones.
     Do not change the laptop or phone layouts. */
  @media (min-width:601px) and (max-width:1199px) and (pointer:coarse) {
    body { font-family:"Courier New", "Portfolio Songti", "Embedded Mobile Songti", "Songti TC", "Songti SC", serif; }
  }
  /* Avoid rasterizing caption text into a permanently low-resolution layer. */
  .inline-gallery-caption { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  /* On phones and iPads, keep gallery arrows together below the caption. */
  @media (max-width:600px), (min-width:601px) and (max-width:1199px) and (pointer:coarse) {
    .inline-gallery-controls .inline-prev,
    .inline-gallery-controls .inline-next {
      top:calc(100% + var(--inline-caption-gap, 0px) + var(--inline-caption-height, 0px) + var(--inline-mobile-arrow-gap, 0px));
      padding:8px 13px;
      font-size:20px;
    }
    .inline-gallery-controls .inline-prev {
      left:50%; right:auto;
      transform:translate(-100%, 0) scale(var(--inline-caption-inverse, var(--inline-ui-inverse, 1)));
      transform-origin:right top;
    }
    .inline-gallery-controls .inline-next {
      left:50%; right:auto;
      transform:translate(0, 0) scale(var(--inline-caption-inverse, var(--inline-ui-inverse, 1)));
      transform-origin:left top;
    }
  }
  .picture .inline-gallery-video { display:none; width:100%; height:100%; object-fit:contain; }

  /* Video controls remain a fixed on-screen size when the Works canvas zooms. */
  .picture .video-shell { position:absolute; inset:0; display:none; }
  .picture .video-shell .inline-gallery-video { display:block; width:100%; height:100%; }
  /* Keep mobile video playback inline and retain the custom player UI. */
  .picture .video-shell .inline-gallery-video::-webkit-media-controls { display:none !important; }
  .picture .video-shell .inline-gallery-video::-webkit-media-controls-enclosure { display:none !important; }
  .video-bar {
    position:absolute; bottom:0; left:0;
    width:calc(100% / var(--inline-ui-inverse, 1));
    display:flex; align-items:center; gap:9px;
    padding:12px 12px 7px;
    color:#000; background:transparent;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
    font:12px/1 'Courier New',monospace;
    transform:scale(var(--inline-ui-inverse, 1));
    transform-origin:left bottom;
  }
  .video-shell:hover .video-bar, .video-shell:focus-within .video-bar, .video-shell.show-controls .video-bar { opacity:1; pointer-events:auto; }
  .video-bar button { border:0; background:none; color:inherit; padding:2px; font:inherit; font-size:16px; cursor:pointer; line-height:1; flex:none; }
  .video-bar input[type=range] { appearance:none; -webkit-appearance:none; min-width:0; height:16px; margin:0; background:transparent; cursor:pointer; }
  .video-bar input[type=range]::-webkit-slider-runnable-track { height:2px; border-radius:2px; background:#000; }
  .video-bar input[type=range]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:7px; height:7px; border-radius:50%; background:#000; margin-top:-2.5px; border:0; }
  .video-bar input[type=range]::-moz-range-track { height:2px; border-radius:2px; background:#000; }
  .video-bar input[type=range]::-moz-range-thumb { width:7px; height:7px; border:0; border-radius:50%; background:#000; }
  .video-bar .video-play svg { display:block; width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:butt; }
  .video-bar .video-mute svg { display:block; width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .video-bar .video-mute.is-muted .sound-waves { display:none; }
  .video-bar .video-mute.is-muted svg { opacity:.65; }
  .video-bar .video-seek { flex:1; }
  .video-bar .video-volume { width:45px !important; flex:none; }
  @media (hover:none) {
    .video-bar { padding:12px 9px 7px; opacity:1; pointer-events:auto; }
    .video-bar button { padding:5px; }
    .picture .video-shell .inline-gallery-video { -webkit-playsinline: true; }
  }
  /* Phone: keep the custom transport bar between the video and its caption. */
  @media (max-width:600px) {
    .picture .video-shell .video-bar {
      bottom:calc(-1 * 42px * var(--inline-ui-inverse, 1));
      padding:5px 6px;
      opacity:1;
      pointer-events:auto;
    }
  }
  #gallery { display:none; position:fixed; inset:0; z-index:20; background:var(--paper); }
  #gallery.open { display:block; overflow:hidden; touch-action:none; }
  /* EDIT — Entire gallery zooms and pans as one canvas. */
  #gallery-stage { position:absolute; inset:0; display:flex; flex-direction:column; transform-origin:0 0; will-change:transform; touch-action:none; }
  #gallery-stage.panning { cursor:grabbing; }
  #gallery-top { padding:18px 22px; display:flex; align-items:center; justify-content:space-between; font-size:13px; }
  #close { border:0; background:none; cursor:pointer; font-size:22px; padding:0 5px; }
  #gallery-main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:18px; padding:0 18px; }
  #gallery-image-wrap { height:100%; max-height:calc(100vh - 135px); flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
  #gallery-image, #gallery-video { max-width:100%; max-height:100%; object-fit:contain; }
  #gallery-video { display:none; width:100%; }
  /* GALLERY ZOOM — editable: image can grow beyond the gallery frame. */
  #gallery-image-wrap { overflow:hidden; touch-action:none; cursor:grab; }
  #gallery-image-wrap.zoom-dragging { cursor:grabbing; }
  #gallery-image { transform-origin:center center; will-change:transform; user-select:none; -webkit-user-drag:none; }

  #gallery-caption { height:104px; flex:0 0 104px; overflow-y:auto; padding:12px 22px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:12px; line-height:18px; white-space:pre-wrap; }
  #notes-name, #notes-switch { position:absolute; z-index:4; white-space:pre-wrap; cursor:pointer; user-select:none; -webkit-user-drag:none; touch-action:none; }
  #notes-name { font-size:18px; line-height:1.45; color:var(--ink); text-decoration:none; }
  #notes-name:hover { text-decoration:underline; text-underline-offset:4px; }
  #notes-switch { font-size:16px; line-height:normal; padding:0; margin:0; float:none; border:0; background:transparent; font-family:inherit; color:inherit; text-align:left; }
  #notes-switch:hover { text-decoration:underline; text-underline-offset:4px; }
  #me-navigation { position:absolute; top:0; left:0; display:flex; gap:28px; padding:0; z-index:3; white-space:nowrap; }
  #me-navigation button { float:none; border:0; background:transparent; padding:0; font:inherit; font-size:16px; cursor:pointer; }
  #me-navigation button:hover { text-decoration:underline; text-underline-offset:4px; }
  #notes-viewport { position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none; }
  #notes-viewport.panning { cursor:grabbing; }
  #notes-world { position:absolute; top:0; left:0; width:1600px; height:1000px; transform-origin:0 0; will-change:transform; }
  .note-link { position:absolute; transform:translateX(-50%); text-align:center; font-size:16px; line-height:1.45; white-space:nowrap; cursor:grab; user-select:none; }
  .note-link .quiet-link { color:#24231f; text-decoration:underline; text-underline-offset:2px; cursor:pointer; -webkit-user-drag:none; user-select:none; }
  .note-link .quiet-link.visited { color:#2259b5; }
  .note-link .quiet-link:hover { text-decoration:underline; }
  body.notes-active #controls, body.notes-active #search { z-index:18; }
  #notes-panel, .info-panel { display:none; position:fixed; z-index:15; inset:0; overflow:auto; background:var(--paper); padding:28px; }
  #notes-panel.open, .info-panel.open { display:block; }
  #notes-panel button:not(#notes-switch), .close-info { float:right; border:0; background:none; cursor:pointer; font-size:22px; }
  #notes-content, .info-content { max-width:680px; margin:25vh auto; font-size:16px; line-height:1.5; white-space:pre-wrap; }
  /* Mobile-only embedded Chinese serif: desktop typography is untouched. */
  @font-face { font-family:"Embedded Mobile Songti"; src:url("fonts/songti-captions.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; }

  /* Additional Songti glyphs for the vertical Reset and Save controls. */
  @font-face { font-family:"Embedded Mobile Songti"; src:url("fonts/songti-controls.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; unicode-range:U+91CD,U+7F6E,U+4FDD,U+5B58; }

  /* Songti glyph for the Works navigation tag on mobile. */
  @font-face { font-family:"Embedded Mobile Songti"; src:url("fonts/songti-works.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; unicode-range:U+753B; }
  @font-face { font-family:"Portfolio Songti"; src:url("fonts/songti-bio.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; }

  /* Complete missing Chinese glyphs with a Songti-style embedded fallback on mobile. */
  @font-face { font-family:"Portfolio Songti"; src:url("fonts/songti-5.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; unicode-range:U+4E0A,U+4E0B,U+4E2A,U+4E66,U+571F,U+5730,U+5899,U+677F,U+6838,U+6843,U+6BCF,U+6D1E,U+77F3,U+7C98,U+818F,U+8BA2,U+9762; }
  @media (max-width:600px) {
    body { font-family:"Courier New", "Portfolio Songti", "Embedded Mobile Songti", "Songti TC", "Songti SC", serif; }
    /* Keep the desktop picture dimensions and arrangement on phones. */
    .word.heading { font-size:15px; }
    #notes-name { font-size:15px; }
    .instruction, #notes-switch { font-size:13px; }
    .note-link { font-size:13px; }
    .item, .note-link, #notes-name, #notes-switch { touch-action:none; }
    #notes-panel { padding:0; overflow:hidden; }
    #notes-viewport { inset:0; }
    #controls button { font-size:13px; }
    #search { font-size:15px; }
    #search input { font-size:15px; }
    #gallery-caption { padding-bottom:12px; }
    .word { max-width:190px; }
    /* Match the quieter scale of the Notes page on mobile. */
    #me-navigation button, .info-content { font-size:13px; }
    .info-content { line-height:1.65; }
    #gallery-main { gap:5px; padding:0 6px; }
    .gallery-button { padding:6px; }
    #search input { width:100px; }
    #controls button { right:2px; }
  }


  /* EDIT — ME PAGE: centered navigation and bilingual information */
  #me-panel { overflow:auto; }
  #me-navigation { position:relative; left:auto!important; top:auto!important; flex-direction:row; align-items:center; justify-content:flex-start; gap:48px; width:auto; }
  #me-panel .me-centered { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:105px; padding:50px 20px; box-sizing:border-box; }
  #me-panel .info-content { margin:0; max-width:none; text-align:left; white-space:normal; line-height:1.7; }
  #me-panel .bio-line { white-space:nowrap; margin-bottom:12px; }
  #me-panel .me-text-block { width:max-content; max-width:100%; text-align:left; }
  /* EDIT — Actual space between navigation and biography (same parent). */
  #me-panel #me-navigation { margin-bottom:64px; }
  #me-panel .bio-line:last-child { margin-bottom:0; }
  #me-panel .bio-line span { margin-left:14px; }
  @media(max-width:700px) {
    #me-panel .me-centered { gap:105px; }
    #me-panel .bio-line { white-space:normal; }
    #me-panel .bio-line span { display:inline; }
  }

</style>
</head>
<body>
<div id="viewport" aria-label="Canvas. Drag the background to move around; drag elements to rearrange them.">
  <div id="world">
    <!-- The starting layout echoes your sketch: no fixed navigation bar; the name, labels, images, and notes are separate movable elements. -->
  </div>
</div>

<form id="search" role="search" onsubmit="return false;">
  <label for="search-input" aria-label="Search">⌕</label>
  <input id="search-input" type="search" aria-label="Search artwork captions and notes" autocomplete="off" spellcheck="false">
  <span id="search-status" aria-live="polite"></span>
</form>
<div id="controls">
  <button id="reset-view" title="Restore original view and layout">重置 reset</button>
  <button id="save-layout" title="Save a screenshot of the entire canvas layout">保存 save</button>
</div>

<div id="gallery" aria-modal="true" role="dialog" aria-label="Image gallery">
  <div id="gallery-stage">
  <div id="gallery-top">
    <span aria-hidden="true"></span>
    <button id="close" aria-label="Close gallery">×</button>
  </div>
  <div id="gallery-main">
    <button class="gallery-button" id="prev" aria-label="Previous image">←</button>
    <div id="gallery-image-wrap"><img id="gallery-image" alt=""><video id="gallery-video" controls playsinline preload="metadata"></video></div>
    <button class="gallery-button" id="next" aria-label="Next image">→</button>
  </div>
  <div id="gallery-caption"></div>
  </div>
</div>

<div id="notes-panel">
  <div id="notes-viewport" aria-label="Notes canvas: drag to pan, scroll to zoom">
    <div id="notes-world">
      <div id="notes-name" role="button" tabindex="0" aria-label="Personal information">张怡澜  Yilan Zhang</div>
      <button id="notes-switch" type="button" aria-label="Return to works">画 works</button>
    </div>
  </div>
</div>
<div id="me-panel" class="info-panel">
 <div class="me-centered">
  <div class="me-text-block">
  <nav id="me-navigation" aria-label="Navigate from personal information">
    <button id="me-to-works" type="button">画 works</button>
    <button id="me-to-notes" type="button">笔记 notes</button>
  </nav>
  <div class="info-content">
    <div class="bio-line">2002年生于中国广东省深圳市 <span>B. 2002, Shenzhen, Guangdong, China</span></div>
    <div class="bio-line">现居芝加哥、深圳 <span>based in Chicago and Shenzhen</span></div>
  </div>
  </div>
 </div>
</div>

<script>
/*
  EDITING THIS WEBSITE

  Use Cmd+F to find EDIT 1, EDIT 2, EDIT 3, or EDIT 4.
  Edit the lists under EDIT 1, EDIT 3, and EDIT 4 as needed.
  To rearrange works, edit x/y in EDIT 1 or use the Layout Editor.
  To add gallery images, use the matching work id in EDIT 3.
  Photo sharpness while zooming is handled automatically; no image changes needed.
  EDIT 2 explains the phone layout; do not paste phone export code there.

  Put your files in folders beside index.html:
    images/   pictures (JPG, PNG, WebP)
    videos/   videos (MP4)
    pdfs/     PDFs

  Give each work a different id. You can use its filename without .jpg.
  Use the same id in EDIT 1 and EDIT 3 (if you add gallery media).
  Match filenames exactly, including capital letters and extensions.
  Separate entries with commas. Keep the [ ] and { } brackets.

  Positions: x moves right or left; y moves down or up.
  Negative coordinates are allowed. Comments like this do not show on the site.
*/

/* ==================== EDIT 1 — WORKS ON THE MAIN PAGE ====================
   HOW TO PASTE CODE FROM THE WORKS LAYOUT EDITOR:
   1. Copy the lines under its DESKTOP heading, beginning with
      { id:"...", type:"image", ... }.
   2. Find const ELEMENTS = [ just below. The name and Notes entries are editable in the Layout Editor too.
   3. Replace ALL entries inside ELEMENTS with the complete editor output,
      including name, Notes and pictures.
   4. Do NOT paste the heading // DESKTOP or a second const ELEMENTS.
      Keep the surrounding [ and ]; and separate entries with commas.
   5. Check that each src points to the exact file in images/.

   Add one line per picture. Copy this example into the list below:
     { id:"202612", type:"image", src:"images/202612.jpg", caption:"202612", x:600, y:450 },

   id      unique name for this work
   src     picture file in the images/ folder
   caption description of the picture
   x, y    starting position on the main page, in pixels

   EDIT HERE: name and notes-label x/y and text are generated by the layout editor.
    Both tags remain clickable links. Replace these lines with generated entries.
   To add more pictures or videos when a work is opened, use EDIT 3.
======================================================================== */
const ELEMENTS = [
  // Move anything by changing x (right/left) and y (down/up).
  { id:"name", type:"me", src:"images/IMG_5634.png", text:"张怡澜  Yilan Zhang", x:5382, y:4390 },
  { id:"notes-label", type:"notes", src:"images/IMG_5633.png", text:"笔记 notes", x:3645, y:4390 },

// Paste these picture entries inside const ELEMENTS = [ ... ]
// EDIT HERE: replace this entire composition with Layout Editor generated entries, including both tags.
{ id:"202621_day", type:"image", src:"images/202621_day.jpg", caption:"202621_day", x:454, y:249 },
  { id:"202619", type:"image", src:"images/202619.jpg", caption:"202619", x:1006, y:538 },
  { id:"202620", type:"image", src:"images/202620.jpg", caption:"202620", x:1245, y:586 },
  { id:"2026_install_202616_17_1103", type:"image", src:"images/2026_install_202616_17_1103.jpg", caption:"2026_install_202616_17_1103", x:-137, y:740 },
  { id:"202616", type:"image", src:"images/202616.jpg", caption:"202616", x:-404, y:752 },
  { id:"20260306", type:"image", src:"images/20260306.jpg", caption:"20260306", x:-857, y:1173 },
  { id:"202615", type:"image", src:"images/202615.jpg", caption:"202615", x:1007, y:1221 },

/* ==================== EDIT 2 — PHONE NAVIGATION =========================
   NO PHONE CODE NEEDS TO BE PASTED HERE.

   The Layout Editor also generates const MOBILE_POSITIONS = { ... }.
   Ignore that second block for this version of the website:
   desktop and phone intentionally use the SAME picture coordinates.
   The exported phone coordinates you supplied are identical to desktop.

   On phones and iPads, the Me and Notes image tabs are automatically moved
   above the artwork and included in the opening fit. Laptop/desktop positions
   remain exactly as entered in EDIT 1. phoneOpeningPan() is retained for
   compatibility with the phone opening behavior.

   If you later arrange DIFFERENT phone picture positions in the editor,
   this website will need a code change to use MOBILE_POSITIONS.
======================================================================== */
const isMobile = () => window.matchMedia("(max-width:600px)").matches;
const mobileWidth = () => Math.max(280, Math.min(window.innerWidth, 600));
// Phone and iPad layouts keep the Me and Notes image tabs inside the fitted
// artwork composition. Laptop/desktop layouts continue using their EDIT 1 coordinates.
const isCompactTouchLayout = () => window.matchMedia("(pointer:coarse) and (max-width:1400px)").matches;
function compactTouchNavigationPositions() {
  const artwork = ELEMENTS.filter(item => item.type === "image");
  if (!artwork.length) return {};
  const minX = Math.min(...artwork.map(item => item.x));
  const minY = Math.min(...artwork.map(item => item.y));
  // Put the two 200px-wide navigation thumbnails in a row just above the
  // upper-left edge of the artwork. They remain part of the same movable canvas.
  return {
    name: { x: minX, y: minY - 155 },
    "notes-label": { x: minX + 224, y: minY - 155 }
  };
}
// Phone opens on the first picture, at the left edge and below the header.
// The picture arrangement itself is never changed.
function phoneOpeningPan() {
  const first = ELEMENTS.find(item => item.type === "image");
  if (!first) return {x:0,y:0};
  return {x:-first.x, y:Math.round(window.innerHeight * 0.37 - first.y)};
}
function originalWorkPosition(item) {
  // On phones and iPads, keep the navigation thumbnails within the composition.
  // On laptops/desktops, preserve their exact saved EDIT 1 coordinates.
  if (isCompactTouchLayout() && (item.type === "me" || item.type === "notes")) {
    const positions = compactTouchNavigationPositions();
    return positions[item.id] || {x:item.x,y:item.y};
  }
  return {x:item.x,y:item.y};
}
const world = document.querySelector("#world");
const viewport = document.querySelector("#viewport");
const gallery = document.querySelector("#gallery");
const galleryImage = document.querySelector("#gallery-image");
const galleryCaption = document.querySelector("#gallery-caption");
const galleryVideo = document.querySelector("#gallery-video");
let scale = 1, panX = isMobile()?phoneOpeningPan().x:-20, panY = isMobile()?phoneOpeningPan().y:-5;
let drag = null, moved = false, activeIndex = 0;
let activeGallery = [];
/* GALLERY ZOOM SETTINGS (EDIT HERE)
   Enter gallery when a centered work fills this fraction of the available screen.
   The image can keep growing after the gallery opens. */
const GALLERY_TRIGGER_FRACTION = 0.86; // EDIT: 0.86 means 86% of available image area
const GALLERY_EXIT_FRACTION = 0.90;
let galleryZoom = 1, galleryOffsetX = 0, galleryOffsetY = 0;
let galleryWorkId = null;
const galleryStage = document.querySelector("#gallery-stage");
const galleryWrap = document.querySelector("#gallery-image-wrap");
function updateGalleryZoom() {
  // Zoom the entire gallery composition, including arrows, caption and close button.
  galleryStage.style.transform = `translate(${galleryOffsetX}px, ${galleryOffsetY}px) scale(${galleryZoom})`;
}
function resetGalleryZoom() {
  galleryZoom = 1; galleryOffsetX = 0; galleryOffsetY = 0;
  updateGalleryZoom();
}
function zoomGalleryAt(next, clientX, clientY) {
  if (next < 1) { closeGallery(); return; }
  next = boundedZoom(next);
  galleryOffsetX = clientX - (clientX - galleryOffsetX) * next / galleryZoom;
  galleryOffsetY = clientY - (clientY - galleryOffsetY) * next / galleryZoom;
  galleryZoom = next;
  updateGalleryZoom();
}
function galleryThreshold() {
  // On phones, reveal the caption before the enlarged image touches the screen edges.
  const fraction = window.matchMedia('(max-width:600px)').matches ? 0.68 : (window.matchMedia('(min-width:601px) and (max-width:1199px) and (pointer:coarse)').matches ? 0.68 : GALLERY_TRIGGER_FRACTION);
  return Math.min(window.innerWidth * .78, window.innerHeight * .73) * fraction;
}
// Cache image elements rather than querying the DOM during every zoom step.
let galleryTriggerPictures=[];
let galleryTriggerFrame=0;
function scheduleGalleryZoomTrigger() {
  if (galleryTriggerFrame) return;
  galleryTriggerFrame=requestAnimationFrame(() => {galleryTriggerFrame=0;checkGalleryZoomTrigger();});
}
// INLINE GALLERY — trigger is based on the picture's actual screen size.
// The image remains in the Works canvas; only arrows and captions appear.
function checkGalleryZoomTrigger() {
  if (isNotesActive()) return;
  const centerX=innerWidth/2, centerY=innerHeight/2;
  const threshold=galleryThreshold();
  const w=200*scale, h=(200*2/3)*scale;
  let best=null, bestDistance=Infinity;
  for (const el of galleryTriggerPictures) {
    const left=panX+Number(el.dataset.x)*scale;
    const top=panY+Number(el.dataset.y)*scale;
    const right=left+w, bottom=top+h;
    const visible=right>0 && bottom>0 && left<innerWidth && top<innerHeight;
    // Avoid toggling high-res-render during zoom so images never jump or re-rasterize mid-gesture.
    if (el.dataset.type !== "image") continue;
    const size=Math.min(w,h);
    if (size < threshold * (galleryWorkId ? GALLERY_EXIT_FRACTION : 1)) continue;
    // Select the eligible image nearest the viewport center, even while panning.
    const dx=(left+right)/2-centerX;
    const dy=(top+bottom)/2-centerY;
    const distance=Math.hypot(dx,dy);
    // Avoid activating a distant image just because it is large.
    if (Math.abs(dx)>Math.max(w*.55,innerWidth*.18) ||
        Math.abs(dy)>Math.max(h*.55,innerHeight*.18)) continue;
    if (distance<bestDistance) { best=el; bestDistance=distance; }
  }
  const nextId=best?.dataset.id || null;
  if (nextId===galleryWorkId) return;
  if (nextId) openGallery(nextId,true);
  else if (galleryWorkId) closeGallery();
}

// INLINE GALLERY — SCREEN-SIZE CONTROLS (EDIT HERE)
// Keep caption and arrows at normal gallery font size even as Works zooms.
// Gaps are screen-pixel distances, converted into world coordinates.
let inlinePicture = null;
let inlineCaptionStartZoom = null;
let inlineUIFrame = 0;
function scheduleInlineGalleryUI() {
  if (!inlinePicture || inlineUIFrame) return;
  inlineUIFrame = requestAnimationFrame(() => { inlineUIFrame = 0; updateInlineGalleryUI(); });
}
function updateInlineGalleryUI() {
  if (!inlinePicture) return;
  const zoom = Math.max(scale, 0.000001);
  inlinePicture.style.setProperty('--inline-ui-inverse', String(1 / zoom));
  // Caption starts at its familiar size, then grows with additional zoom.
  // Gallery arrows grow with captions; video controls retain their original screen size.
  const captionGrowth = Math.max(1, zoom / Math.max(inlineCaptionStartZoom || zoom, 0.000001));
  inlinePicture.style.setProperty('--inline-caption-inverse', String(captionGrowth / zoom));
  inlinePicture.style.setProperty('--inline-arrow-gap', `${44 / zoom}px`);
  const phone = window.matchMedia('(max-width:600px)').matches || window.matchMedia('(min-width:601px) and (max-width:1199px) and (pointer:coarse)').matches;
  const caption = inlinePicture.querySelector('.inline-gallery-caption');
  if (phone && caption) {
    // Measure the visible caption so mobile arrows stay below its growing text.
    const captionHeight = caption.getBoundingClientRect().height;
    inlinePicture.style.setProperty('--inline-caption-height', `${captionHeight / zoom}px`);
    inlinePicture.style.setProperty('--inline-mobile-arrow-gap', `${20 / zoom}px`);
    // Reserve space for the transport bar below videos; image captions stay close.
    const isVideo = !!inlinePicture.querySelector('.video-shell[style*="display: block"]');
    inlinePicture.style.setProperty('--inline-caption-gap', `${(isVideo ? 57 : 12) / zoom}px`);
  } else {
    inlinePicture.style.setProperty('--inline-caption-gap', `${4 / zoom}px`);
  }
}
function applyView() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  scheduleInlineGalleryUI();
  scheduleGalleryZoomTrigger();
}
// Automatically frame the full Works composition, regardless of item positions.
// Measure the actual rendered items rather than assuming the 1600 x 1000 world
// contains them. The margin is measured in screen pixels.
function fitWorksComposition() {
  // Laptop/desktop: frame artwork only, preserving the existing navigation positions.
  // Phone/iPad: include the repositioned Me and Notes thumbnails so all three
  // groups of images are visible together inside the opening frame.
  const selector = isCompactTouchLayout()
    ? '.item[data-type="image"], .item[data-type="me"], .item[data-type="notes"]'
    : '.item[data-type="image"]';
  const items = [...world.querySelectorAll(selector)];
  if (!items.length) return;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const el of items) {
    const x=Number(el.dataset.x), y=Number(el.dataset.y);
    if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
    minX=Math.min(minX,x); minY=Math.min(minY,y);
    maxX=Math.max(maxX,x+el.offsetWidth);
    maxY=Math.max(maxY,y+el.offsetHeight);

  "2026.5.2", "2026.5.4", "2026.5.6", "2026.5.7",
  "2026.5.8", "2026.5.9", "2026.5.12", "2026.5.13",
  "2026.5.16", "2026.5.16_1", "2026.5.16_2", "2026.6.3",
  "2026.6.8", "2026.6.13", "2026.7.2", "2026.7.29", "2026.8.6", "2026.8.20"
].map((label, i) => ({ id:"note-"+i, label, href:"pdfs/"+label+".pdf", x:800, y:125+i*38 }));
function originalNotePosition(note, i) {
  return isMobile() ? {x:mobileWidth()/2, y:105+i*29} : {x:note.x,y:note.y};
}
const notesViewport = document.querySelector("#notes-viewport");
const notesWorld = document.querySelector("#notes-world");
let notesScale=1, notesPanX=0, notesPanY=0, notesDrag=null, notesMoved=false;
let notesViewInitialized=false;
let notesNavInitialized=false;
const notesNavOriginal = {};
function applyNotesView() { notesWorld.style.transform=`translate3d(${notesPanX}px, ${notesPanY}px, 0) scale(${notesScale})`; }
function createNote(note) {
  const el=document.createElement("div"); el.className="note-link"; el.dataset.id=note.id;
  const a=document.createElement("span"); a.textContent=note.label;
  a.addEventListener("click", e => {
    if(notesMoved) { e.preventDefault(); e.stopPropagation(); }
    else a.classList.add("visited");
  });
  makeQuietLink(a, note.href, "Open " + note.label + " PDF");
  el.appendChild(a); notesWorld.appendChild(el); setPosition(el,...Object.values(originalNotePosition(note, NOTES.indexOf(note))));
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0 || pinch || touchPoints.size>1)return;
    notesDrag={kind:"item",el,startX:e.clientX,startY:e.clientY,x:Number(el.dataset.x),y:Number(el.dataset.y)};
    notesMoved=false;
    // Do not capture the pointer: doing so redirects the click away from the PDF link.
    // The window pointermove listener already handles dragging outside the link.
    e.stopPropagation();
  });
}
NOTES.forEach(createNote); applyNotesView();
// Navigation on Notes is draggable, but a simple click still follows its action.
// Disabling native link dragging avoids the grey URL preview.
for (const id of ["notes-name", "notes-switch"]) {
  const el = document.getElementById(id);
  el.addEventListener("dragstart", e => e.preventDefault());
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0 || pinch || touchPoints.size > 1) return;
    notesDrag = {kind:"item", el, startX:e.clientX, startY:e.clientY,
      x:Number(el.dataset.x), y:Number(el.dataset.y)};
    notesMoved = false;
    e.stopPropagation();
  });
  // Suppress click after moving, but never interfere with an ordinary click.
  el.addEventListener("click", e => {
    if (notesMoved) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
}

notesViewport.addEventListener("pointerdown",e=>{
  if(e.button!==0 || pinch || touchPoints.size>1 || e.target.closest(".note-link") || e.target.closest("#notes-name, #notes-switch"))return;
  notesDrag={kind:"pan",startX:e.clientX,startY:e.clientY,x:notesPanX,y:notesPanY};
  notesMoved=false; notesViewport.classList.add("panning"); notesViewport.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove",e=>{
  if(!notesDrag || pinch)return;
  const dx=e.clientX-notesDrag.startX,dy=e.clientY-notesDrag.startY;
  if(Math.abs(dx)+Math.abs(dy)>3) notesMoved=true;
  if(notesDrag.kind==="pan") {notesPanX=notesDrag.x+dx;notesPanY=notesDrag.y+dy;applyNotesView();}
  else setPosition(notesDrag.el,notesDrag.x+dx/notesScale,notesDrag.y+dy/notesScale);
});
window.addEventListener("pointerup",()=>{
  if(!notesDrag)return;
  const wasMoved=notesMoved;
  notesDrag=null;notesViewport.classList.remove("panning");
  if(wasMoved)setTimeout(()=>notesMoved=false,100);else notesMoved=false;
});
let notesWheelFrame = 0, notesWheelTarget = null, notesWheelLastTime = 0;
function animateNotesWheelZoom(now) {
  notesWheelFrame = 0;
  if (!notesWheelTarget) return;
  const dt = notesWheelLastTime ? Math.min(32, Math.max(4, now - notesWheelLastTime)) : 16.67;
  notesWheelLastTime = now;
  const t = notesWheelTarget;
  const ease = 1 - Math.exp(-dt / 95);
  const ns = notesScale * Math.exp(Math.log(t.scale / notesScale) * ease);
  const ratio = ns / notesScale;
  const nx = t.px - (t.px - notesPanX) * ratio;
  const ny = t.py - (t.py - notesPanY) * ratio;
  if (Math.abs(Math.log(t.scale / notesScale)) < 0.00015) {
    const finalRatio = t.scale / notesScale;
    notesPanX = t.px - (t.px - notesPanX) * finalRatio;
    notesPanY = t.py - (t.py - notesPanY) * finalRatio;
    notesScale = t.scale;
    notesWheelTarget = null;
    notesWheelLastTime = 0;
  } else {
    notesScale = ns; notesPanX = nx; notesPanY = ny;
  }
  applyNotesView();
  if (notesWheelTarget) notesWheelFrame = requestAnimationFrame(animateNotesWheelZoom);
}
notesViewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  const delta = Math.max(-180, Math.min(180, e.deltaY * unit));
  if (!delta) return;
  const r=notesViewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if (e.ctrlKey) {
    if (notesWheelFrame) { cancelAnimationFrame(notesWheelFrame); notesWheelFrame = 0; }
    notesWheelTarget = null; notesWheelLastTime = 0;
    const ns = boundedZoom(notesScale * Math.exp(-delta * 0.008));
    const ratio = ns / notesScale;
    notesPanX = x - (x - notesPanX) * ratio;
    notesPanY = y - (y - notesPanY) * ratio;
    notesScale = ns;
    applyNotesView();
    return;
  }
  const t = notesWheelTarget || { scale: notesScale, px: x, py: y };
  t.px = x;
  t.py = y;
  t.scale = boundedZoom(t.scale * Math.exp(-delta * 0.0025));
  notesWheelTarget = t;
  if (!notesWheelFrame) {
    notesWheelLastTime = 0;
    notesWheelFrame = requestAnimationFrame(animateNotesWheelZoom);
  }
},{passive:false});
notesViewport.addEventListener("pointerdown", () => {
  if (notesWheelFrame) cancelAnimationFrame(notesWheelFrame);
  notesWheelFrame = 0; notesWheelTarget = null;
}, { capture:true });
/* EDIT — NOTES PAGE: responsive fit of all PDF titles */
function fitNotesPage() {
  const vw=notesViewport.clientWidth, vh=notesViewport.clientHeight;
  if (!vw || !vh) return;
  // Place PDF links in one column, with fixed spacing in world coordinates.
  const step=42, x=800, top=70;
  NOTES.forEach((note,i)=>{
    const el=notesWorld.querySelector(`[data-id="${note.id}"]`);
    if(el) setPosition(el,x,top+i*step);
  });
  // Navigation positions in the same coordinate system, independent of Works.
  const name=document.getElementById("notes-name");
  const works=document.getElementById("notes-switch");
  setPosition(name,100,top);
  setPosition(works,1210,top+Math.max(0,NOTES.length-1)*step*.28);
  // Fit the full vertical PDF list and the horizontal composition to viewport.
  const bottom=top+Math.max(0,NOTES.length-1)*step+35;
  const minX=100,maxX=1350,minY=top,maxY=bottom;
  const marginX= Math.min(42,vw*.04), marginY=Math.min(32,vh*.04);
  // Center the PDF column itself, rather than the bounding box of all tags.
  // Leave sufficient room on either side for the name and Works navigation.
  const pdfCenterX=x+50;
  notesScale=Math.min(
    (vw/2-marginX)/(pdfCenterX-minX),
    (vw/2-marginX)/(maxX-pdfCenterX),
    (vh-2*marginY)/(maxY===minX?1:bottom-minY),
    1.35
  );
  // NOTES PAGE — HORIZONTAL POSITION (EDIT HERE)
  // Positive value shifts the PDF column and Works tag right together.
  // Keep this proportional to viewport width for different screen sizes.
  const NOTES_RIGHT_SHIFT = Math.min(70, vw * 0.04);
  notesPanX=vw/2-pdfCenterX*notesScale+NOTES_RIGHT_SHIFT;
  notesPanY=vh/2-((minY+maxY)/2)*notesScale;
  applyNotesView();
}
function resetNotes() { fitNotesPage(); }
function isNotesActive(){return document.querySelector("#notes-panel").classList.contains("open") && !document.querySelector("#me-panel").classList.contains("open");}
function syncPageControls(){document.body.classList.toggle("notes-active",isNotesActive());document.querySelector("#search-input").value="";filterCurrentPage("");}
function filterCurrentPage(query){
  const terms=query.trim().toLocaleLowerCase().split(/\s+/u).filter(Boolean);
  const matches=text=>terms.every(term=>String(text||"").toLocaleLowerCase().includes(term));
  if(isNotesActive()) {
    notesWorld.querySelectorAll(".note-link").forEach(el=>{
      const note=NOTES.find(n=>n.id===el.dataset.id);
      el.style.opacity=!terms.length||matches(note?.label)?"1":"0.18";
    });
  } else {
    world.querySelectorAll(".item").forEach(el=>{
      const item=ELEMENTS.find(n=>n.id===el.dataset.id);
      // Include the primary caption and all captions in this work's gallery.
      const captions=[item?.caption,...(WORK_GALLERIES[item?.id]||[]).map(media=>media.caption)].filter(Boolean).join(" ");
      const isNav=item?.type==="me" || item?.type==="notes";
      const hit=item?.type==="image" && matches(captions);
      el.style.opacity=!terms.length||isNav||hit?"1":"0.18";
    });
  }
}

function showMe() {
  const panel=document.querySelector("#me-panel");
  panel.classList.add("open");
  panel.scrollTop=0;
  syncPageControls();
}
function showNotes() {
  const panel=document.querySelector("#notes-panel");
  panel.classList.add("open");
  panel.scrollTop=0;
  syncPageControls();
  fitNotesPage();
}
document.querySelector("#notes-switch").addEventListener("click", () => { if (notesMoved) return; document.querySelector("#notes-panel").classList.remove("open");syncPageControls(); });
document.querySelector("#notes-name").addEventListener("click", e => { e.preventDefault(); if (!notesMoved) showMe(); });
document.querySelector("#notes-name").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (!notesMoved) showMe();
  }
});
document.querySelector("#me-to-works").addEventListener("click", () => {
  document.querySelector("#me-panel").classList.remove("open");
  document.querySelector("#notes-panel").classList.remove("open");
  syncPageControls();
});
document.querySelector("#me-to-notes").addEventListener("click", () => {
  window.open("notes.html", "_blank", "noopener");
});
document.querySelector("#reset-view").addEventListener("click", () => {
  if(isNotesActive()){resetNotes();return;}
  // Restore the original coordinates from ELEMENTS for every canvas item.
  ELEMENTS.forEach(item => {
    const el = [...world.querySelectorAll(".item")].find(node => node.dataset.id === item.id);
    if (el) { const pos=originalWorkPosition(item); setPosition(el,pos.x,pos.y); }
  });
  // Frame the complete original composition automatically.
  fitWorksComposition();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeGallery(); document.querySelector("#notes-panel").classList.remove("open"); document.querySelector("#me-panel").classList.remove("open");syncPageControls(); }
  if (galleryWorkId && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) stepGallery(e.key === "ArrowRight" ? 1 : -1);
});
// SAVE BUTTON — export the complete layout, independent of the current zoom.
document.querySelector("#save-layout").addEventListener("click", async () => {
  // Local file:// pages give images opaque origins in Chromium/Edge.
  // No canvas export code can bypass this browser security restriction.
  if (location.protocol === "file:") {
    alert("To save the complete layout, open this website through http://localhost or your published GitHub Pages URL, not by double-clicking the HTML file.\n\nOn Mac: open Terminal in your website folder, run: python3 -m http.server 8000\nThen visit: http://localhost:8000/ in Edge.");
    return;
  }
  if (typeof html2canvas !== "function") {
    alert("The screenshot library could not load. Please check your internet connection.");
    return;
  }
  const notes = isNotesActive();
  const source = notes ? notesWorld : world;
  // Measure actual movable objects, not the visible browser window or the
  // nominal 1600 x 1000 world (artwork may extend beyond either).
  const objects = [...source.children].filter(el =>
    el.matches('.item, .note-link, #notes-name, #notes-switch'));
  if (!objects.length) return;
  const margin = 45;
  const bounds = objects.reduce((b, el) => {
    const x = parseFloat(el.style.left) || 0;
    const y = parseFloat(el.style.top) || 0;
    // Note links are centered on their x coordinate via translateX(-50%).
    const left = x - (el.classList.contains('note-link') ? el.offsetWidth / 2 : 0);
    b.minX = Math.min(b.minX, left);
    b.minY = Math.min(b.minY, y);
    b.maxX = Math.max(b.maxX, left + el.offsetWidth);
    b.maxY = Math.max(b.maxY, y + el.offsetHeight);
    return b;
  }, {minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity});
  const width = Math.ceil(bounds.maxX - bounds.minX + margin * 2);
  const height = Math.ceil(bounds.maxY - bounds.minY + margin * 2);
  const background = getComputedStyle(document.body).backgroundColor;
  const exportWorld = source.cloneNode(true);
  // Keep the capture in normal document coordinates: a fixed-position holder
  // is clipped to the viewport by html2canvas on some browsers.
  const holder = document.createElement('div');
  holder.style.cssText = `position:absolute;left:0;top:0;width:${width}px;height:${height}px;pointer-events:none;z-index:-1;overflow:hidden;background:${background};`;
  exportWorld.style.cssText = `position:relative;left:${margin-bounds.minX}px;top:${margin-bounds.minY}px;width:${source.offsetWidth}px;height:${source.offsetHeight}px;transform:none;transform-origin:0 0;overflow:visible;background:transparent;`;
  holder.appendChild(exportWorld);
  document.body.appendChild(holder);
  const button = document.querySelector("#save-layout");
  button.style.pointerEvents = "none";
  try {
    await Promise.all([...exportWorld.querySelectorAll("img")].map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener("load", resolve, {once:true});
        img.addEventListener("error", resolve, {once:true});
      });
    }));
    const canvas = await html2canvas(holder, {
      backgroundColor: background,
      scale: 1.5,
      width, height,
      windowWidth: Math.max(innerWidth, width),
      windowHeight: Math.max(innerHeight, height),
      scrollX: 0, scrollY: 0,
      useCORS: true,
      logging: false
    });
    if (!canvas.width || !canvas.height) throw new Error("Empty screenshot canvas");
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    if (!blob) throw new Error("Unable to encode PNG (possibly cross-origin images)");
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = notes ? "notes-canvas-layout.png" : "entire-canvas-layout.png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (error) {
    console.error("Full-layout screenshot failed:", error);
    alert(error && error.name === "SecurityError" ? "An image is blocked from screenshot export by browser cross-origin security. Check that the site and artwork files are loaded from the same http://localhost or HTTPS origin, then retry." : "Unable to save the full layout. Open the browser console for details.");
  } finally {
    holder.remove();
    button.style.pointerEvents = "";
  }
});

// Search artwork captions (including gallery media), without changing positions.
// Search responds as the visitor types; punctuation in captions still links to comma.html.
const commaSearchInput = document.querySelector("#search-input");
commaSearchInput.addEventListener("input", event => {
  if (!event.isComposing) filterCurrentPage(event.target.value);
});
commaSearchInput.addEventListener("compositionend", () => {
  filterCurrentPage(commaSearchInput.value);
});
document.querySelector("#search").addEventListener("submit", event => {
  event.preventDefault();
  filterCurrentPage(commaSearchInput.value);
});

</script>
