  spreadRadius: 1850, imageGap: 65,
  commaFontSize: 18, // world pixels: comma looks normal after zooming out
  initialPictureWidthScreens: 2.8, // opening image spans this many screen widths
  minZoom: .035, maxZoom: 90

function findSpot(w,h){
  for(let i=0;i<12000;i++){
    const r=SETTINGS.spreadRadius*(1+Math.floor(i/1500)*.4);

    if(rectangles.every(existing=>!intersects(candidate,existing)))return candidate;
  }

  const maxRight=Math.max(0,...rectangles.map(r=>r.x+r.w));

  const probe=new Image();probe.onload=()=>{

function zoomAt(next,cx,cy){next=Math.max(SETTINGS.minZoom,Math.min(SETTINGS.maxZoom,next));panX=cx-(cx-panX)*next/scale;panY=cy-(cy-panY)*next/scale;scale=next;render()}

  const ctx=hitCanvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#000';ctx.font='120px Courier New';ctx.textBaseline='top';
  ctx.fillText(',',0,0);
  const pixels=ctx.getImageData(0,0,200,240).data;
  function onInk(clientX,clientY){
    const x=((clientX-panX)/scale-box.x)/SETTINGS.commaFontSize*120;
    const y=((clientY-panY)/scale-box.y)/SETTINGS.commaFontSize*120;
    const px=Math.floor(x*1.0),py=Math.floor(y*1.0);
    return px>=0&&py>=0&&px<200&&py<240&&pixels[(py*200+px)*4+3]>80;
  }
  let downOnInk=false,downPoint=null,ignorePointerUntil=0;
  viewport.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    downOnInk=onInk(e.clientX,e.clientY);
    downPoint={x:e.clientX,y:e.clientY};
  },true);
  viewport.addEventListener('pointerup',e=>{
    if(Date.now()>ignorePointerUntil&&e.pointerType!=='touch'&&downOnInk&&downPoint&&Math.hypot(e.clientX-downPoint.x,e.clientY-downPoint.y)<5&&onInk(e.clientX,e.clientY)){
      window.open('comma.html','_blank','noopener');
    }
    downOnInk=false;
  },true);
  // Reset fits every loaded picture and the comma on screen. It never removes images.
  function fitAll(){
    const boxes=[...world.querySelectorAll('.picture')].map(el=>({x:+el.dataset.x,y:+el.dataset.y,w:SETTINGS.imageWidth,h:SETTINGS.imageHeight}));
    boxes.push({x:box.x,y:box.y,w:SETTINGS.commaFontSize,h:SETTINGS.commaFontSize*1.2});
    const left=Math.min(...boxes.map(b=>b.x)),right=Math.max(...boxes.map(b=>b.x+b.w));
    const top=Math.min(...boxes.map(b=>b.y)),bottom=Math.max(...boxes.map(b=>b.y+b.h));
    scale=Math.max(SETTINGS.minZoom,Math.min(SETTINGS.maxZoom,Math.min(innerWidth*.86/(right-left),innerHeight*.84/(bottom-top))));
    panX=innerWidth/2-(left+right)/2*scale;
    panY=innerHeight/2-(top+bottom)/2*scale;
    render();
  }
  const input=document.getElementById('search-input');
  function restore(){if(searchReturnView){({scale,panX,panY}=searchReturnView);searchReturnView=null;render()}}
  function findComma(){
    if(![',','，','comma','逗号','逗號'].includes(input.value.trim().toLowerCase())){restore();return}
    if(!searchReturnView)searchReturnView={scale,panX,panY};
    const target=Math.min(SETTINGS.maxZoom,Math.max(SETTINGS.minZoom,Math.min(innerWidth*.88/11,innerHeight*.82/12)));
    scale=target;panX=innerWidth/2-(box.x+SETTINGS.commaFontSize*.35)*scale;
    panY=innerHeight/2-(box.y+SETTINGS.commaFontSize*.7)*scale;render();
  }
  input.addEventListener('input',()=>{clearTimeout(searchTimer);if(!input.value.trim())restore();else searchTimer=setTimeout(findComma,350)});
  document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();clearTimeout(searchTimer);findComma();input.blur()});
  document.getElementById('reset-view').addEventListener('click',()=>{input.value='';searchReturnView=null;fitAll()});
  document.getElementById('save-layout').addEventListener('click',async()=>{
    const controls=document.getElementById('controls'),search=document.getElementById('search');
    controls.style.visibility='hidden';search.style.visibility='hidden';
    try{
      if(typeof html2canvas==='undefined')throw Error('Screenshot tool unavailable');
      const canvas=await html2canvas(document.body,{backgroundColor:'#f7f6f2',useCORS:true});
      const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='comma-view.png';a.click();
    }catch(err){alert('Screenshot unavailable. Please use the browser screenshot function.')}finally{controls.style.visibility='';search.style.visibility=''}
  });
  // Report missing files without silently confusing them with far-away images.
  const missing=IMAGES.filter(src=>!loadedSources.has(src));
  if(missing.length)console.warn('Comma images not loaded (check paths and capitalization):',missing);
}

init();
</script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script></body></html>
