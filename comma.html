<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10"><title>,</title>
<style>
:root{--paper:#f7f6f2;--ink:#24231f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Courier New",monospace}#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}#viewport.dragging{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0;width:1px;height:1px}.picture{position:absolute;user-select:none;touch-action:none;cursor:grab}.picture.dragging{cursor:grabbing}.picture img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}#comma{position:absolute;color:var(--ink);font-family:"Courier New",monospace;line-height:1;white-space:pre;text-decoration:none!important;pointer-events:none;user-select:none;touch-action:none}#comma:hover,#comma:focus,#comma:active{text-decoration:none!important;outline:none}
</style></head><body><div id="viewport"><div id="world"></div></div>
<script>
/* EDIT HERE — list the images to scatter, using paths relative to comma.html.
   Replace these examples with your own image filenames. No captions or gallery.
   You can also add or remove entries. */
const IMAGES = [
  "images/comma/1_d.jpeg",
  "images/comma/1.PNG",
  "images/comma/2_d.jpeg",
  "images/comma/2.PNG",
  "images/comma/3.JPG",
  "images/comma/4_d.jpeg",
  "images/comma/4.PNG",
  "images/comma/5_d.jpeg",
  "images/comma/5.PNG",
  "images/comma/6.jpeg",
  "images/comma/7.jpeg",
  "images/comma/8.jpeg",
  "images/comma/9.JPG",
  "images/comma/10.PNG"
];
/* EDIT HERE — layout and opening zoom. */
const SETTINGS = {
  imageWidth: 200, imageHeight: 200 * 2 / 3, // same 3:2 picture frames as homepage
  spreadRadius: 1850, imageGap: 65,
  commaFontSize: 18, // world pixels: comma looks normal after zooming out
  initialPictureWidthScreens: 2.8, // opening image spans this many screen widths
  minZoom: .035, maxZoom: 90
};
const viewport=document.getElementById('viewport'),world=document.getElementById('world');
const random=(a,b)=>a+Math.random()*(b-a);
const rectangles=[];
function intersects(a,b,gap=SETTINGS.imageGap){return a.x<b.x+b.w+gap&&a.x+a.w+gap>b.x&&a.y<b.y+b.h+gap&&a.y+a.h+gap>b.y}
function findSpot(w,h){
  for(let i=0;i<12000;i++){
    const r=SETTINGS.spreadRadius*(1+Math.floor(i/1500)*.4);
    const candidate={x:random(-r,r),y:random(-r,r),w,h};
    if(rectangles.every(existing=>!intersects(candidate,existing)))return candidate;
  }
  // Guaranteed non-overlapping fallback if the random area becomes crowded.
  const maxRight=Math.max(0,...rectangles.map(r=>r.x+r.w));
  return {x:maxRight+SETTINGS.imageGap+100,y:0,w,h};
}
function createPicture(src){return new Promise(resolve=>{
  const probe=new Image();probe.onload=()=>{
    const width=SETTINGS.imageWidth;
    const height=SETTINGS.imageHeight;
    const rect=findSpot(width,height);rectangles.push(rect);
    const el=document.createElement('div');el.className='picture';el.style.width=width+'px';el.style.height=height+'px';
    el.dataset.x=rect.x;el.dataset.y=rect.y;el.style.left=rect.x+'px';el.style.top=rect.y+'px';
    const img=document.createElement('img');img.src=src;img.alt='';img.draggable=false;el.appendChild(img);world.appendChild(el);resolve();
  };probe.onerror=()=>{console.warn('Image not found:',src);resolve()};probe.src=src;
})}
let scale=1,panX=0,panY=0,gesture=null,dragMoved=false;
function render(){world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`}
function zoomAt(next,cx,cy){next=Math.max(SETTINGS.minZoom,Math.min(SETTINGS.maxZoom,next));panX=cx-(cx-panX)*next/scale;panY=cy-(cy-panY)*next/scale;scale=next;render()}
function point(e){return {x:e.clientX,y:e.clientY}}
const active=new Map();
viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  active.set(e.pointerId,point(e));
  if(active.size===2){gesture=null;return}
  const el=e.target.closest('.picture');
  gesture={id:e.pointerId,el,startX:e.clientX,startY:e.clientY,baseX:el?+el.dataset.x:panX,baseY:el?+el.dataset.y:panY};
  dragMoved=false;viewport.classList.add('dragging');
  if(!e.target.closest('#comma'))viewport.setPointerCapture(e.pointerId);
});
let pinch=null;
viewport.addEventListener('pointermove',e=>{
  if(active.has(e.pointerId))active.set(e.pointerId,point(e));
  if(active.size>=2){
    const [a,b]=[...active.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    if(!pinch)pinch={d,scale,cx,cy,wx:(cx-panX)/scale,wy:(cy-panY)/scale};
    else{scale=Math.max(SETTINGS.minZoom,Math.min(SETTINGS.maxZoom,pinch.scale*d/Math.max(1,pinch.d)));panX=cx-pinch.wx*scale;panY=cy-pinch.wy*scale;render()}
    dragMoved=true;return;
  }
  if(!gesture||gesture.id!==e.pointerId)return;
  const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;
  if(Math.abs(dx)+Math.abs(dy)>4)dragMoved=true;
  if(gesture.el){const x=gesture.baseX+dx/scale,y=gesture.baseY+dy/scale;gesture.el.dataset.x=x;gesture.el.dataset.y=y;gesture.el.style.left=x+'px';gesture.el.style.top=y+'px'}
  else{panX=gesture.baseX+dx;panY=gesture.baseY+dy;render()}
});
function endPointer(e){active.delete(e.pointerId);if(active.size<2)pinch=null;gesture=null;viewport.classList.remove('dragging')}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(scale*Math.exp(-e.deltaY*.0013),e.clientX,e.clientY)},{passive:false});
// Prevent browser-native image dragging.
world.addEventListener('dragstart',e=>e.preventDefault());
async function init(){
  await Promise.all(IMAGES.map(createPicture));
  const comma=document.createElement('a');comma.id='comma';comma.href='comma.html';comma.target='_blank';comma.rel='noopener';comma.textContent=',';
  comma.setAttribute('aria-label','Open another randomly arranged comma page');
  comma.style.fontSize=SETTINGS.commaFontSize+'px';
  const box=findSpot(SETTINGS.commaFontSize*.75,SETTINGS.commaFontSize*1.2);
  rectangles.push(box);comma.style.left=box.x+'px';comma.style.top=box.y+'px';world.appendChild(comma);
  // Initial screen: zoom into a randomly selected loaded picture.
  // Each new tab independently chooses its opening picture and random layout.
  const pictures=[...world.querySelectorAll('.picture')];
  if(pictures.length){
    const chosen=pictures[Math.floor(Math.random()*pictures.length)];
    const x=Number(chosen.dataset.x),y=Number(chosen.dataset.y);
    scale=Math.max(SETTINGS.minZoom,Math.min(SETTINGS.maxZoom,
      innerWidth*SETTINGS.initialPictureWidthScreens/SETTINGS.imageWidth));
    // Look at a random interior part of the picture rather than its exact center.
    const focusX=x+SETTINGS.imageWidth*random(.30,.70);
    const focusY=y+SETTINGS.imageHeight*random(.30,.70);
    panX=innerWidth/2-focusX*scale;
    panY=innerHeight/2-focusY*scale;
  }else{
    scale=1;panX=innerWidth/2-box.x;panY=innerHeight/2-box.y;
  }
  render();
  // Only ink pixels are clickable; transparent character bearings remain pannable.
  const hitCanvas=document.createElement('canvas');
  hitCanvas.width=200;hitCanvas.height=240;
  const ctx=hitCanvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#000';ctx.font='120px Courier New';ctx.textBaseline='top';
  ctx.fillText(',',0,0);
  const pixels=ctx.getImageData(0,0,200,240).data;
  function onInk(clientX,clientY){
    const x=((clientX-panX)/scale-box.x)/SETTINGS.commaFontSize*120;
    const y=((clientY-panY)/scale-box.y)/SETTINGS.commaFontSize*120;
    const px=Math.floor(x*1.0),py=Math.floor(y*1.0);
    return px>=0&&py>=0&&px<200&&py<240&&pixels[(py*200+px)*4+3]>80;
  }
  let downOnInk=false,downPoint=null;
  viewport.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    downOnInk=onInk(e.clientX,e.clientY);
    downPoint={x:e.clientX,y:e.clientY};
  },true);
  viewport.addEventListener('pointerup',e=>{
    if(downOnInk&&downPoint&&Math.hypot(e.clientX-downPoint.x,e.clientY-downPoint.y)<5&&onInk(e.clientX,e.clientY)){
      window.open('comma.html','_blank','noopener');
    }
    downOnInk=false;
  },true);
}
init();
</script></body></html>
