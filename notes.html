
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Notes — Yilan Zhang</title>

<style>
  :root { --paper: #ffffff; }

  * { box-sizing: border-box; }

  html, body {
    margin:0;
    width:100%;
    min-height:100%;
    background:#ffffff;
    overflow-x:hidden;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }

  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display:none;
    width:0;
    height:0;
  }

  body {
    color:#24231f;
    font-family:"Courier New","Songti TC","Songti SC","STSong",serif;
  }

  #reading-flow,
  .reading-cycle {
    width:100%;
    display:flex;
    flex-direction:column;
    gap:0;
    margin:0;
    padding:0;
    border:0;
  }

  .reading-cycle { flex:none; }

  .spread-row {
    width:100%;
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:0;
    flex:none;
    margin:0;
    padding:0;
    border:0;
    line-height:0;
    font-size:0;
  }

  .page {
    display:block;
    position:relative;
    flex:0 0 50%;
    width:50%;
    min-width:0;
    margin:0;
    padding:0;
    border:0;
    outline:0;
    background:#ffffff;
    line-height:0;
    overflow:hidden;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .page canvas {
    display:block;
    width:100%;
    height:auto;
    margin:0;
    padding:0;
    border:0;
    background:#ffffff;
  }

  .page.landscape {
    flex-basis:100%;
    width:100%;
  }

  .page.filler {
    cursor:pointer;
    background:#ffffff;
  }

  .page.filler::after {
    content:"";
    display:block;
    width:100%;
    aspect-ratio:var(--page-ratio);
    background:#ffffff;
  }

  .loading,.error {
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    font:14px/1.5 "Courier New",monospace;
    text-align:center;
  }

  .error { color:#8b2525; }
</style>
</head>

<body>
<main id="reading-flow" aria-label="Notes">
  <div class="loading" id="status">Loading notes…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(() => {
  "use strict";

  // Add PDFs here. Newest first.
  const NOTES = [
    "2026.8.20.pdf",
    "2026.8.6.pdf",
    "2026.7.29.pdf",
    "2026.7.2.pdf",
    "2026.6.13.pdf",
    "2026.6.8.pdf",
    "2026.6.3.pdf",
    "2026.5.16_2.pdf",
    "2026.5.16_1.pdf",
    "2026.5.16.pdf",
    "2026.5.13.pdf",
    "2026.5.12.pdf",
    "2026.5.9.pdf",
    "2026.5.8.pdf",
    "2026.5.7.pdf",
    "2026.5.6.pdf",
    "2026.5.4.pdf",
    "2026.5.2.pdf",
    "2026.4.22.pdf",
    "2026.3.20.pdf",
    "2026.3.12.pdf",
    "2026.2.24.pdf"
  ].map(label => ({
    label,
    url:"pdfs/" + label
  }));

  const flow = document.getElementById("reading-flow");
  const status = document.getElementById("status");
  const VERSION = "3.11.174";

  if (!window.pdfjsLib) {
    status.className = "error";
    status.textContent =
      "The PDF reader could not load. Check your internet connection and reload.";
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${VERSION}/pdf.worker.min.js`;

  function pageLink(spec) {
    const a = document.createElement("a");

    a.className = "page" +
      (spec.orientation === "landscape" ? " landscape" : "");

    a.href = spec.file.url + "#page=" + spec.pageNumber;
    a.target = "_blank";
    a.rel = "noopener";

    a.setAttribute(
      "aria-label",
      spec.file.label + ", page " + spec.pageNumber
    );

    a.dataset.renderKey = spec.key;

    return a;
  }

  // Blank page matches the dimensions of the PDF page it completes.
  function fillerLink(spec) {
    const a = document.createElement("a");

    a.className = "page filler";
    a.href = spec.file.url;
    a.target = "_blank";
    a.rel = "noopener";

    const viewport = spec.page.getViewport({scale:1});

    a.style.setProperty(
      "--page-ratio",
      `${viewport.width} / ${viewport.height}`
    );

    a.setAttribute(
      "aria-label",
      "Blank page completing " + spec.file.label
    );

    return a;
  }

  async function inspectFile(file) {
    const pdf = await pdfjsLib.getDocument(file.url).promise;
    const pages = [];

    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const v = page.getViewport({scale:1});

      const orientation =
        v.width / v.height > 1.12 ? "landscape" : "portrait";

      pages.push({
        file,
        pageNumber:n,
        page,
        orientation,
        key:file.url + "|" + n
      });
    }

    return pages;
  }

  // Portrait pages pair only within their own PDF.
  // An odd final portrait page gets a white blank page.
  // Landscape pages occupy a whole row.
  function arrangeRows(allFiles) {
    const rows = [];

    for (const pages of allFiles) {
      let left = null;

      for (const spec of pages) {
        if (spec.orientation === "landscape") {
          if (left) {
            rows.push({left, filler:left});
            left = null;
          }

          rows.push({full:spec});

        } else if (!left) {
          left = spec;

        } else {
          rows.push({left, right:spec});
          left = null;
        }
      }

      if (left) {
        rows.push({left, filler:left});
      }
    }

    return rows;
  }

  function rowElement(row) {
    const section = document.createElement("section");
    section.className = "spread-row";

    if (row.full) {
      section.appendChild(pageLink(row.full));
    } else {
      section.appendChild(pageLink(row.left));

      section.appendChild(
        row.right
          ? pageLink(row.right)
          : fillerLink(row.filler)
      );
    }

    return section;
  }

  async function renderPage(el, spec) {
    if (el.dataset.rendered === "1") return;

    const width = Math.max(
      160,
      el.getBoundingClientRect().width
    );

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const base = spec.page.getViewport({scale:1});

    const viewport = spec.page.getViewport({
      scale:width * dpr / base.width
    });

    const canvas = document.createElement("canvas");

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    canvas.style.width = "100%";
    canvas.style.height = "auto";

    el.appendChild(canvas);

    await spec.page.render({
      canvasContext:canvas.getContext("2d",{alpha:false}),
      viewport
    }).promise;

    el.dataset.rendered = "1";
  }

  function copyCycle(cycle) {
    const copy = cycle.cloneNode(true);

    copy.querySelectorAll("canvas").forEach(c => c.remove());

    copy.querySelectorAll("[data-rendered]").forEach(el => {
      delete el.dataset.rendered;
    });

    return copy;
  }

  async function build() {
    const allFiles = [];

    for (const file of NOTES) {
      try {
        allFiles.push(await inspectFile(file));
      } catch (err) {
        console.error("Could not load " + file.url, err);
        allFiles.push([]);
      }
    }

    const rows = arrangeRows(allFiles);

    if (!rows.length) {
      status.className = "error";
      status.textContent =
        "No PDF pages could be loaded. Check the PDFs in the pdfs folder.";
      return;
    }

    const specs = new Map(
      allFiles.flat().map(spec => [spec.key,spec])
    );

    const cycle = document.createElement("div");
    cycle.className = "reading-cycle";

    rows.forEach(row => cycle.appendChild(rowElement(row)));

    const before = copyCycle(cycle);
    const after = copyCycle(cycle);

    flow.replaceChildren(before, cycle, after);

    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;

        const el = entry.target;
        const spec = specs.get(el.dataset.renderKey);

        if (spec) {
          renderPage(el,spec).catch(console.error);
        }

        observer.unobserve(el);
      }
    }, {rootMargin:"1400px 0px"});

    flow.querySelectorAll("[data-render-key]").forEach(el => {
      observer.observe(el);
    });

    requestAnimationFrame(() => {
      const h = cycle.getBoundingClientRect().height;

      window.scrollTo(0,h);

      const first = cycle.querySelector("[data-render-key]");

      if (first) {
        const spec = specs.get(first.dataset.renderKey);

        if (spec) {
          renderPage(first,spec).catch(console.error);
        }
      }
    });

    let recentering = false;

    window.addEventListener("scroll", () => {
      if (recentering) return;

      const h = cycle.getBoundingClientRect().height;

      if (!h) return;

      const y = window.scrollY;

      if (y < h * 0.55) {
        recentering = true;

        window.scrollTo(0,y+h);

        requestAnimationFrame(() => recentering=false);

      } else if (y > h * 1.45) {
        recentering = true;

        window.scrollTo(0,y-h);

        requestAnimationFrame(() => recentering=false);
      }
    }, {passive:true});
  }

  build().catch(err => {
    console.error(err);

    status.className = "error";
    status.textContent =
      "Something went wrong while loading the notes.";
  });

})();
</script>
</body>
</html>
